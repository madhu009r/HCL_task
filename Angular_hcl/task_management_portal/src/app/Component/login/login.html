<div class="container mt-5">

<h2>Login</h2>

<input type="email"
class="form-control"
placeholder="Email"
[(ngModel)]="loginData.email">

<br>

<input type="password"
class="form-control"
placeholder="Password"
[(ngModel)]="loginData.PasswordHash">

<br>

<button class="btn btn-success" (click)="login()">
Login
</button>

<br><br>

<p>
Don't have an account?
<a routerLink="/register">Register here</a>
</p>

</div>
